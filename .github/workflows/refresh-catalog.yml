name: Refresh opportunity feeds
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test feed adapters
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refresh sources
        id: refresh
        continue-on-error: true
        run: python .github/scripts/refresh_catalog.py
      - name: Validate snapshot before publishing
        run: node --input-type=module -e "import fs from 'node:fs'; import {readFeed} from './src/live-catalog.js'; readFeed(JSON.parse(fs.readFileSync('src/catalog-feed.json','utf8')));"
      - name: Publish snapshot and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/catalog-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public opportunity feeds [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
